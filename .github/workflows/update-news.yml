name: Update News

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4

      - name: Update news data
        run: |
          python scripts/update_news.py --output-dir data --window-hours 24 --rss-opml feeds/follow.opml

      - name: Commit changes
        run: |
          git config user.name "lixiaochen111"
          git config user.email "lixiaochen0529@gmail.com"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update news data"
          git push
